<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;font-size:18px">
<h1 id="a">Скрипт не запустился</h1>
<div id="b">Ожидание...</div>

<script>
document.getElementById('a').textContent = 'Обычный script работает';
</script>

<script type="module">
try {
  document.getElementById('b').textContent = 'Загружаю Three.js...';
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  document.getElementById('b').textContent = 'Three.js OK: ' + THREE.REVISION;

  const pinata = await import('https://cdn.jsdelivr.net/npm/@dgreenheck/three-pinata@0.3.10/dist/three-pinata.esm.js');
  document.getElementById('b').textContent += ' | Pinata OK: ' + Object.keys(pinata).slice(0,5).join(',');

  const rapier = await import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.11.2/rapier.es.js');
  document.getElementById('b').textContent += ' | Rapier OK';

} catch (e) {
  document.getElementById('b').textContent = 'ОШИБКА: ' + e.message;
  document.getElementById('b').style.color = 'red';
}
</script>

</body>
</html>
