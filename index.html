<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Fracture Editor</title>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; touch-action: none; }
  #title { position: absolute; top: 12px; left: 0; right: 0; color: #fff; font-family: sans-serif; font-size: 15px; text-align: center; pointer-events: none; }
  #hint { position: absolute; bottom: 20px; left: 0; right: 0; color: #aaa; font-family: sans-serif; font-size: 13px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="title">Tap the cube to fracture it</div>
<div id="hint">Drag to rotate &middot; Pinch to zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { DestructibleMesh, FractureOptions } from 'https://cdn.jsdelivr.net/npm/@dgreenheck/three-pinata@0.3.10/dist/three-pinata.esm.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.11.2/rapier.es.js';

await RAPIER.init();

const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(6, 12, 8);
dirLight.castShadow = true;
scene.add(dirLight);

const groundBody = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, -0.1, 0));
world.createCollider(RAPIER.ColliderDesc.cuboid(20, 0.1, 20), groundBody);

const groundMesh = new THREE.Mesh(
  new THREE.BoxGeometry(40, 0.2, 40),
  new THREE.MeshStandardMaterial({ color: 0x2a2a3e })
);
groundMesh.position.y = -0.1;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const geo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
const outerMat = new THREE.MeshStandardMaterial({ color: 0x4a90e2, roughness: 0.4 });
const innerMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.8 });

const mesh = new DestructibleMesh(geo, outerMat, innerMat);
mesh.position.set(0, 3, 0);
mesh.castShadow = true;
scene.add(mesh);

const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(0, 3, 0);
const body = world.createRigidBody(bodyDesc);
world.createCollider(RAPIER.ColliderDesc.cuboid(0.7, 0.7, 0.7), body);

const fragments = [];
let isFractured = false;

function fracture() {
  if (isFractured) return;
  isFractured = true;

  const options = new FractureOptions({
    fractureMethod: 'voronoi',
    fragmentCount: 35,
    voronoiOptions: {
      mode: '3D',
      impactPoint: new THREE.Vector3(0, 0, 0)
    }
  });

  world.removeRigidBody(body);
  mesh.visible = false;

  mesh.fracture(options, (frag) => {
    frag.position.copy(mesh.position);
    frag.castShadow = true;
    scene.add(frag);

    const fragBodyDesc = RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(frag.position.x, frag.position.y, frag.position.z);
    const fragBody = world.createRigidBody(fragBodyDesc);

    const box = new THREE.Box3().setFromObject(frag);
    const size = new THREE.Vector3();
    box.getSize(size);
    const half = { x: Math.max(size.x / 2, 0.05), y: Math.max(size.y / 2, 0.05), z: Math.max(size.z / 2, 0.05) };

    world.createCollider(RAPIER.ColliderDesc.cuboid(half.x, half.y, half.z), fragBody);

    fragments.push({ mesh: frag, body: fragBody });
  });
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  const startX = e.clientX, startY = e.clientY;
  const onUp = (upEvent) => {
    const dx = upEvent.clientX - startX;
    const dy = upEvent.clientY - startY;
    if (Math.hypot(dx, dy) < 10) fracture();
    renderer.domElement.removeEventListener('pointerup', onUp);
  };
  renderer.domElement.addEventListener('pointerup', onUp);
});

function animate() {
  requestAnimationFrame(animate);
  world.step();

  if (!isFractured) {
    const t = body.translation();
    const r = body.rotation();
    mesh.position.set(t.x, t.y, t.z);
    mesh.quaternion.set(r.x, r.y, r.z, r.w);
  } else {
    for (const f of fragments) {
      const t = f.body.translation();
      const r = f.body.rotation();
      f.mesh.position.set(t.x, t.y, t.z);
      f.mesh.quaternion.set(r.x, r.y, r.z, r.w);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
